<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ship" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Ship hull + superstructure (centered) -->
  <g transform="translate(32 32)">
    <!-- Hull -->
    <path d="M -14 4 L 14 4 L 11 11 L -11 11 Z" fill="url(#ship)"/>
    <!-- Superstructure -->
    <rect x="-3" y="-9" width="6" height="13" fill="url(#ship)"/>
    <!-- Bridge -->
    <rect x="-2" y="-12" width="4" height="3" fill="url(#ship)"/>
    <!-- Mast -->
    <line x1="0" y1="-12" x2="0" y2="-15" stroke="#ffffff" stroke-width="1"/>
    <circle cx="0" cy="-15" r="1.2" fill="#fbbf24"/>
  </g>
  <!-- Wave line at bottom -->
  <path d="M 4 50 Q 16 46, 32 50 T 60 50" stroke="#0e7490" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
